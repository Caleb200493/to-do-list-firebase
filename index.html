<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hello World</title>
    <link href="/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="heading" class="w-auto">
      <h1 class="m-5">TO-DO LIST</h1>
    </div>
    <div
      id="main1"
      class="container mx-auto px-3 min-h-screen flex flex-col pb-20"
    >
      <div id="main" class="flex items-center p-2 m-2">
        <div class="container mx-auto p-4">
          <table class="table-auto w-full" id="myTable">
            <thead>
              <tr class="bg-gray-200">
                <th class="px-4 py-2 text-left">To-Do</th>
                <th class="px-4 py-2 text-left">Checklist</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>

      <div
        id="input"
        class="flex items-center w-full bg-white p-2 border-t relative bottom-0"
      >
        <!-- here you will get the input values -->
        <input
          type="text"
          name="to-do-content"
          id="content"
          class="m-2 shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline placeholder-gray-400"
          placeholder="Enter your to-do item"
        />

        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
          id="listbtn"
        >
          Add
        </button>
      </div>
    </div>
    <script defer type="module" src="/main.js"></script>
  </body>
</html>
